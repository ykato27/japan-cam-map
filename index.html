<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本ライブカメラマップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  #app { display: flex; flex-direction: column; height: 100%; }
  header { padding: 8px 12px; background: #0b3d66; color: #fff; }
  header h1 { font-size: 16px; margin: 0 0 6px; }
  header .sub { font-size: 11px; opacity: .85; }
  #controls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
  .chip { border: 1px solid rgba(255,255,255,.5); background: transparent; color: #fff; border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .chip.active { background: #fff; color: #0b3d66; font-weight: 700; }
  #search { flex: 1; min-width: 140px; padding: 6px 10px; border-radius: 999px; border: none; font-size: 13px; }
  #count { font-size: 12px; }
  #map { flex: 1; }
  .badge { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 4px; background: #e8f1f8; color: #0b3d66; margin-right: 4px; }
  footer { font-size: 10px; color: #666; padding: 4px 10px; background: #f4f6f8; }

  /* 大画面ビューア */
  #viewer { position: fixed; inset: 0; background: rgba(0,0,0,.78); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 10px; }
  #viewer.open { display: flex; }
  .viewer-box { width: min(1180px, 97vw); max-height: 96vh; background: #fff; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .viewer-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px 4px; }
  .viewer-head h3 { margin: 0; font-size: 18px; flex: 1; }
  .viewer-close { border: none; background: #eef1f4; border-radius: 999px; width: 36px; height: 36px; font-size: 17px; cursor: pointer; flex: none; }
  .viewer-media { position: relative; width: 100%; aspect-ratio: 16/9; max-height: 76vh; background: #111; }
  .viewer-media .video-wrap { position: absolute; inset: 0; }
  .viewer-media iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .viewer-media img.still { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .viewer-media .yt-thumb { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .85; }
  .viewer-media .play-btn { position: absolute; inset: 0; margin: auto; width: 210px; height: 58px; border: none; border-radius: 999px; background: rgba(200, 30, 30, .94); color: #fff; font-size: 17px; font-weight: 700; cursor: pointer; }
  .viewer-foot { padding: 8px 14px 12px; font-size: 12px; color: #333; }
  .viewer-foot .meta { font-size: 11px; color: #555; margin-bottom: 4px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🗾 日本ライブカメラマップ</h1>
    <div class="sub">日本中の定点ライブカメラを地図から見る。マーカーをタップすると大きな画面でリアルタイム映像が出ます。</div>
    <div id="controls">
      <span id="chips"></span>
      <input id="search" type="search" placeholder="地名・川名・カメラ名で検索">
      <span id="count"></span>
    </div>
  </header>
  <div id="map"></div>
  <footer>地図: 国土地理院タイル（出典: 国土地理院）／ カメラ映像は各配信元の公開ページ・公開画像へのリンク・埋め込みです。各カメラの著作権は配信元に帰属します。</footer>
</div>

<div id="viewer" role="dialog" aria-modal="true">
  <div class="viewer-box">
    <div class="viewer-head"><h3 id="v-title"></h3><button class="viewer-close" id="v-close" aria-label="閉じる">✕</button></div>
    <div class="viewer-media" id="v-media"></div>
    <div class="viewer-foot" id="v-foot"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.js"></script>
<script src="cameras.js"></script>
<script>
(function () {
  var gsiStd = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
    attribution: '出典: <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>', maxZoom: 18
  });
  var gsiPhoto = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', {
    attribution: '出典: <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>', maxZoom: 18
  });
  var map = L.map('map', { layers: [gsiStd] }).setView([37.6, 138.0], 5);
  L.control.layers({ '地理院地図': gsiStd, '航空写真': gsiPhoto }).addTo(map);

  var cluster = L.markerClusterGroup({ maxClusterRadius: 45 });
  map.addLayer(cluster);

  var categories = ['すべて'];
  (window.CAMERAS || []).forEach(function (c) { if (categories.indexOf(c.category) < 0) categories.push(c.category); });

  var activeCat = 'すべて';
  var query = '';
  var markers = [];

  var viewerEl = document.getElementById('viewer');
  var vTitle = document.getElementById('v-title');
  var vMedia = document.getElementById('v-media');
  var vFoot = document.getElementById('v-foot');
  var refreshTimer = null;

  function stopMedia() {
    if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
    vMedia.innerHTML = '';
  }
  function closeViewer() { viewerEl.classList.remove('open'); stopMedia(); }
  document.getElementById('v-close').addEventListener('click', closeViewer);
  viewerEl.addEventListener('click', function (e) { if (e.target === viewerEl) closeViewer(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeViewer(); });

  function openViewer(c) {
    stopMedia();
    vTitle.textContent = c.name;
    var foot = '<div class="meta"><span class="badge">' + c.category + '</span>' + c.pref + ' ' + (c.city || '')
      + (c.type === 'image' ? ' <span class="badge">広告なし</span>' : '') + '</div>'
      + '配信元: ' + (c.provider || '公開ライブカメラ') + ' ／ <a href="' + c.source + '" target="_blank" rel="noopener">公式／配信ページを開く</a>';
    if (c.type === 'youtube') {
      vMedia.innerHTML = '<div class="video-wrap"><img class="yt-thumb" src="https://i.ytimg.com/vi/' + c.videoId + '/hqdefault.jpg" alt="">'
        + '<button class="play-btn" type="button">▶ ライブを見る</button></div>';
      foot += '<div class="meta">開いただけでは広告は出ません。再生は任意です（YouTube配信のため、再生開始時に広告が入る場合があります）</div>';
      var wrap = vMedia.querySelector('.video-wrap');
      L.DomEvent.disableClickPropagation(wrap);
      wrap.style.cursor = 'pointer';
      wrap.addEventListener('click', function (ev) {
        if (ev) { ev.preventDefault(); ev.stopPropagation(); }
        wrap.innerHTML = '<iframe src="https://www.youtube.com/embed/' + c.videoId + '?autoplay=1&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="' + c.name + '"></iframe>';
      });
    } else if (c.type === 'image') {
      vMedia.innerHTML = '<img class="still" data-img alt="' + c.name + '">';
      foot += '<div class="meta">静止画（60秒ごとに自動更新） <span data-clock></span></div>';
      vFoot.innerHTML = foot;
      var img = vMedia.querySelector('img[data-img]');
      var clock = vFoot.querySelector('[data-clock]');
      var load = function () {
        img.src = c.image + (c.image.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now();
        if (clock) clock.textContent = '（' + new Date().toLocaleTimeString('ja-JP') + ' 更新）';
      };
      load();
      refreshTimer = setInterval(load, 60000);
      viewerEl.classList.add('open');
      return;
    }
    vFoot.innerHTML = foot;
    viewerEl.classList.add('open');
  }

  function render() {
    cluster.clearLayers();
    markers = [];
    var n = 0;
    (window.CAMERAS || []).forEach(function (c) {
      if (activeCat !== 'すべて' && c.category !== activeCat) return;
      if (query) {
        var hay = (c.name + ' ' + c.pref + ' ' + (c.city || '') + ' ' + c.category);
        if (hay.indexOf(query) < 0) return;
      }
      var m = L.marker([c.lat, c.lon]);
      m.on('click', function () { openViewer(c); });
      markers.push(m);
      cluster.addLayer(m);
      n++;
    });
    document.getElementById('count').textContent = n + ' 件';
  }

  var chipsEl = document.getElementById('chips');
  categories.forEach(function (cat) {
    var b = document.createElement('button');
    b.className = 'chip' + (cat === 'すべて' ? ' active' : '');
    b.textContent = cat;
    b.addEventListener('click', function () {
      activeCat = cat;
      chipsEl.querySelectorAll('.chip').forEach(function (x) { x.classList.toggle('active', x.textContent === cat); });
      render();
    });
    chipsEl.appendChild(b);
  });

  var searchEl = document.getElementById('search');
  var debounce = null;
  searchEl.addEventListener('input', function () {
    clearTimeout(debounce);
    debounce = setTimeout(function () { query = searchEl.value.trim(); render(); }, 200);
  });

  render();
})();
</script>
</body>
</html>
