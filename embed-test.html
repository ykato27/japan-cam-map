<body><h1>embed sweep v3 (final check)</h1><div id="status">starting...</div><pre id="results"></pre><div id="players"></div>
<script>
var VIDEOS = [["kfIQBC0hrII", "札幌・大通（創世スクエア）"], ["wRYonRnKsKw", "札幌 すすきの交差点"], ["3SKn4LgGJk8", "新千歳空港 滑走路（STV）"], ["uvNVpMKG8rw", "新千歳空港 ターミナル（STV）"], ["s--MDmshT3I", "函館山"], ["eLEU-R_XN1k", "仙台市 青葉区八幡"], ["IQms8zArI7w", "佐渡・両津港（TeNY 5地点ループ）"], ["OuCbntsMsWY", "成田国際空港 A滑走路"], ["XNOSZ4m8Ofc", "保護猫カフェ（東京キャットガーディアン）"], ["gFRtAAmiFbE", "新宿・歌舞伎町"], ["dfVK7ld38Ys", "渋谷スクランブル交差点"], ["2PIdi3Xa7TY", "羽田空港 第2ターミナル"], ["LQ2h_Uhmezg", "出雲大社前駅・神門通り"], ["tuNC0ot0j9I", "葉山 富士山・江の島"], ["LfSlCi_odQ0", "BANTV琵琶湖ライブカメラ [B]"], ["sM2IjSRBwnY", "大津港ライブカメラ [B]"], ["tp0h_Ta7EEM", "彦根ライブカメラ [B]"], ["uSDnNQ92Du4", "大和西大寺駅ライブカメラ [B]"], ["MW_zWAuTeAk", "眉山ライブカメラ [B]"], ["owWQ_TECeVA", "サガテレビお天気カメラ [B]"], ["KU3tuKKIyuU", "加部島・風の見える丘ライブカメラ [B]"], ["h9v4l3maqfs", "大淀川ライブカメラ（朝日新聞） [B]"], ["SPmojUlAA-Q", "延岡ホテルブルーエール ライブカメラ [B]"]];
var BATCH = 3, WAIT = 32000;
var idx = 0, done = 0, playing = 0;
var results = {};
function flush() {
  document.getElementById('results').textContent = VIDEOS.filter(function (v) { return results[v[0]]; })
    .map(function (v) { return results[v[0]] + ' | ' + v[0] + ' | ' + v[1]; }).join('\n');
}
function nextBatch() {
  if (idx >= VIDEOS.length) {
    document.getElementById('status').textContent = 'DONE: ' + playing + '/' + VIDEOS.length + ' playing';
    document.title = 'DONE embed sweep v3';
    return;
  }
  var slice = VIDEOS.slice(idx, idx + BATCH);
  document.getElementById('status').textContent = 'batch ' + (idx / BATCH + 1) + ' / ' + Math.ceil(VIDEOS.length / BATCH);
  var host = document.getElementById('players');
  host.innerHTML = '';
  var local = {}, pls = {};
  slice.forEach(function (v, i) {
    var div = document.createElement('div'); div.id = 'bp' + i; host.appendChild(div);
    local[v[0]] = 'NO RESPONSE';
    pls[v[0]] = new YT.Player('bp' + i, { width: 320, height: 180, videoId: v[0],
      playerVars: { playsinline: 1 },
      events: {
        onReady: function (e) { if (local[v[0]] === 'NO RESPONSE') local[v[0]] = 'READY-NOT-PLAYING'; e.target.mute(); e.target.playVideo(); },
        onStateChange: function (e) { if (e.data === YT.PlayerState.PLAYING) local[v[0]] = 'PLAYING'; },
        onError: function (e) { local[v[0]] = 'ERROR ' + e.data; }
      }});
  });
  setTimeout(function () {
    slice.forEach(function (v) { if (local[v[0]] === 'READY-NOT-PLAYING' && pls[v[0]].playVideo) { try { pls[v[0]].playVideo(); } catch (e) {} } });
  }, WAIT / 2);
  setTimeout(function () {
    slice.forEach(function (v) {
      results[v[0]] = local[v[0]];
      if (local[v[0]] === 'PLAYING') playing++;
      done++;
    });
    flush();
    idx += BATCH;
    nextBatch();
  }, WAIT);
}
function onYouTubeIframeAPIReady() { nextBatch(); }
var tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(tag);
</script></body></html>
